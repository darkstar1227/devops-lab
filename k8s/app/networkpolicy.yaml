# Default deny for every pod in the namespace, both directions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hello
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The app only accepts HTTP from labelled clients in this namespace and from
# Prometheus in the monitoring namespace. It makes no outbound calls, so no
# egress rule is added.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fastapi-hello-ingress
  namespace: hello
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fastapi-hello
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              hello-client: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
---
# Pods labelled role=client may resolve DNS and call the app. Ingress to the
# app still requires hello-client=true, so a role=client pod without that
# label is blocked by the policy above, not by missing egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-egress
  namespace: hello
spec:
  podSelector:
    matchLabels:
      role: client
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fastapi-hello
      ports:
        - port: 8000
