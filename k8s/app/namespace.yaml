apiVersion: v1
kind: Namespace
metadata:
  name: hello
  labels:
    # Sigstore policy-controller only checks namespaces with this label.
    policy.sigstore.dev/include: "true"
    # Pod Security Admission: reject pods that do not meet "restricted".
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
