apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-hello
  namespace: hello
  labels:
    app.kubernetes.io/name: fastapi-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 584792 # _daemon_ in the rock
        runAsGroup: 584792
        fsGroup: 584792
        seccompProfile:
          type: RuntimeDefault
      # Pebble refuses to start unless $PEBBLE (/var/lib/pebble/default) is
      # writable. With a read-only root filesystem, copy the image's layer
      # files into an emptyDir and mount that over the Pebble directory.
      initContainers:
        - name: pebble-layers
          image: ghcr.io/darkstar1227/fastapi-hello@sha256:d895d1a8448333b7d2122f2504da044e29aaa87eeb5421510927271ade4f8c2b
          command: [/usr/bin/cp, -r, /var/lib/pebble/default/layers, /pebble/]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - name: pebble
              mountPath: /pebble
      containers:
        - name: app
          image: ghcr.io/darkstar1227/fastapi-hello@sha256:d895d1a8448333b7d2122f2504da044e29aaa87eeb5421510927271ade4f8c2b
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          volumeMounts:
            - name: pebble
              mountPath: /var/lib/pebble/default
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pebble
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
