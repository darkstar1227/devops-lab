name: fastapi-hello
title: fastapi-hello
version: '0.1'
summary: Minimal FastAPI hello-world rock on a chiselled bare base
description: |
  This is fastapi project's description. You have a paragraph or two to tell the
  most important story about it. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the
  container registries out there.
base: bare
build-base: ubuntu@24.04
platforms:
  arm64:
    build-on:
    - arm64
    build-for:
    - arm64
parts:
  fastapi-framework/dependencies:
    plugin: python
    stage-packages:
    - python3.12-venv_ensurepip
    source: .
    python-packages:
    - uvicorn
    python-requirements:
    - requirements.txt
    build-environment:
    - PARTS_PYTHON_INTERPRETER: python3.12
  fastapi-framework/install-app:
    plugin: dump
    source: .
    organize:
      app.py: app/app.py
    stage:
    - app/app.py
    permissions:
    - owner: 584792
      group: 584792
  fastapi-framework/runtime:
    plugin: nil
    override-build: |-
      mkdir -m 777 ${CRAFT_PART_INSTALL}/tmp
      ln -sf /usr/bin/bash ${CRAFT_PART_INSTALL}/usr/bin/sh
    stage-packages:
    - bash_bins
    - coreutils_bins
    - ca-certificates_data
  fastapi-framework/logging:
    plugin: nil
    override-build: |-
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/opt/promtail
      mkdir -p $CRAFT_PART_INSTALL/etc/promtail
    permissions:
    - path: opt/promtail
      owner: 584792
      group: 584792
    - path: etc/promtail
      owner: 584792
      group: 584792
run-user: _daemon_
services:
  fastapi:
    override: replace
    command: /bin/python3 -m uvicorn app:app
    startup: enabled
    environment:
      UVICORN_HOST: 0.0.0.0
    user: _daemon_
    working-dir: /app
